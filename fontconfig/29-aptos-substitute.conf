<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- LibreOffice nao tem as fontes proprietarias da Microsoft (Aptos, o
     padrao novo do Office desde 2023/2024). Sem isso, ele cai pra uma
     serifada generica (Liberation Serif) que nao lembra em nada o visual
     original — Carlito/Caladea sao substitutos metricamente compativeis
     feitos pelo Google especificamente pra esse tipo de caso. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Aptos</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Aptos Display</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Cambria Math</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Caladea</string></edit>
  </match>
</fontconfig>
